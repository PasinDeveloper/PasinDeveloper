name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch stats
        env:
          # PROFILE_TOKEN is optional; add it to count private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.ts
      - name: Build SVGs
        run: node scripts/build.ts
      - name: Bust GitHub's image cache
        run: |
          V=$(date +%Y%m%d%H%M)
          sed -E -i "s#(assets/[a-z-]+-(dark|light)\.svg)(\?v=[0-9]+)?#\1?v=$V#g" README.md
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
